[project]
name = "adv-mlaa-at3-frontend"
version = "0.1.0"
description = "Advanced MLAA Assignment 3 Frontend"
authors = [
    {name = "Adv MLAA AT3 Group 29"}
]
readme = "README.md"
requires-python = "3.11.4"
dependencies = [
    "requests (>=2.32.5,<3.0.0)",
    "pandas (>=2.3.3,<3.0.0)",
    "matplotlib (>=3.10.7,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "altair (>=5.5.0,<6.0.0)",
    "streamlit (>=1.50.0,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
